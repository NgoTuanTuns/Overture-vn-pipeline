# Vietnam bounding box (coarse); exact filtering happens in silver
bbox:
  xmin: 102.1
  xmax: 109.5
  ymin: 8.4
  ymax: 23.4

# Overture theme/type paths ingested into bronze
themes:
  places: theme=places/type=place
  divisions: theme=divisions/type=division_area

bronze_root: data/bronze

# One release per month; for months with a patch, the patch release is used
releases:
  - 2026-09-23.1
  - 2026-10-21.0

# Changelog theme/type paths ingested into bronze (Vietnam bbox only)
changelog_themes:
  places: theme=places/type=place
